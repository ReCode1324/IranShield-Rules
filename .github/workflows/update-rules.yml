name: Twice-Monthly IranShield Rules Update

"on":
  schedule:
    - cron: '17 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iranshield-twice-monthly-build
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Build verified domain and IP rules
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/build.py --out dist

      - name: Audit updated upstream repositories
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover.py dist/discovered-sources.json

      - name: Install pinned official sing-box release with SHA-256 verification
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/install_sing_box.py
          "$HOME/.local/bin/sing-box" version

      - name: Compile and verify every SRS file
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          sources=(dist/sing-box/*.json)

          if (( ${#sources[@]} != 6 )); then
            echo "Expected exactly 6 SRS source JSON files; found ${#sources[@]}" >&2
            exit 1
          fi

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT

          for json in "${sources[@]}"; do
            "$HOME/.local/bin/sing-box" rule-set compile --output "${json%.json}.srs" "$json"

            "$HOME/.local/bin/sing-box" rule-set decompile --output "$verify_dir/$(basename "$json")" "${json%.json}.srs"

            python -m json.tool "$verify_dir/$(basename "$json")" >/dev/null
          done

      - name: Publish NekoBox srslist.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/publish.py --out dist

      - name: Validate published files and SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail

          python scripts/finalize.py dist

          python -m json.tool srslist.json >/dev/null

          cmp srslist.json nekobox/srslist.json
          cmp srslist.json dist/srslist.json
          cmp srslist.json dist/nekobox/srslist.json

      - name: Commit and push updated rules
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- dist/ srslist.json nekobox/srslist.json

          if git diff --staged --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m "chore(rules): twice-monthly refresh $(date -u +%Y-%m-%d)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iranshield-rules
          path: dist/
          if-no-files-found: error
          retention-days: 30
